# Builds snapr for each platform when a version tag (e.g. v0.2.0) is pushed,
# and publishes the builds with a SHA256SUMS file as a GitHub release. The
# app's updater (src/update.rs) downloads its platform's file from the
# latest release, so the file names below must stay in step with
# `update::asset_name`: snapr-<os>-<arch>[.exe], and on macOS
# snapr-macos-<arch>.app.zip (scripts/macos-bundle.sh, which also makes the
# .dmg people install from). On Linux there's also snapr-linux-<arch>.deb to
# install from, which the updater leaves to the package manager.
#
# The release notes are the commits since the previous version tag
# (scripts/release-notes.sh), grouped by their Conventional Commits types
# (CONTRIBUTING.md).
#
# Tags with a hyphen (v1.0.0-rc.1) become pre-releases, which the updater
# doesn't offer.
#
# Run it by hand (Actions > Release > Run workflow) to try the builds without
# publishing anything.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: snapr-windows-x86_64.exe
          # Cross-compiled on x64, whose image has the MSVC ARM64 tools and
          # the clang that ring needs for ARM64 (.cargo/config.toml links
          # the C runtime in).
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset: snapr-windows-aarch64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: snapr-macos-aarch64
          # 24.04 rather than the older 22.04: the PipeWire bindings need
          # its newer PipeWire headers.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: snapr-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # A build that reports an older version than its release would offer
      # itself as an update forever.
      - name: Check the tag matches Cargo.toml
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version in Cargo.toml ($version)"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libclang-dev \
            libasound2-dev libpipewire-0.3-dev libspa-0.2-dev \
            libgbm-dev libdrm-dev libegl-dev libwayland-dev libxkbcommon-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            libdbus-1-dev

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Name the build
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/snapr${{ runner.os == 'Windows' && '.exe' || '' }}" "dist/${{ matrix.asset }}"

      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        with:
          tool: cargo-deb

      # The .deb people install from (Cargo.toml's [package.metadata.deb]),
      # its dependencies worked out from the libraries snapr links to. The
      # bare binary above stays for other distributions and their updater.
      - name: Package the .deb
        if: runner.os == 'Linux'
        run: cargo deb --no-build --target ${{ matrix.target }} --output "dist/${{ matrix.asset }}.deb"

      # The self-signed certificate snapr.app is signed with, so macOS keeps
      # its permissions across updates (scripts/macos-bundle.sh). It must
      # stay the same certificate: a new one resets everyone's permissions
      # once more. A release won't go out without it; a run by hand signs
      # ad hoc instead.
      - name: Load the signing certificate
        if: runner.os == 'macOS'
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "::error::The MACOS_SIGNING_P12 secret is missing"
              exit 1
            fi
            echo "::warning::No MACOS_SIGNING_P12 secret: signing ad hoc"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          base64 --decode <<<"$P12" > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "SNAPR_SIGN_IDENTITY=snapr self-signed" >> "$GITHUB_ENV"
          echo "SNAPR_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      # snapr.app as a .dmg to install from and a zip for the updater. The
      # bare binary above stays for installs from before snapr.app, which
      # run it bare and whose updater fetches it.
      - name: Package snapr.app
        if: runner.os == 'macOS'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          bash scripts/macos-bundle.sh "target/${{ matrix.target }}/release/snapr" "$version" aarch64 dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      # The whole history and its tags, for the notes.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release notes from the commits since the last version
        run: bash scripts/release-notes.sh "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" | tee notes.md

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum snapr-* > SHA256SUMS && cat SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "snapr ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --verify-tag \
            "${flags[@]}"
