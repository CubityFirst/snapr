[package]
name = "snapr"
version = "0.1.0"
edition = "2024"
description = "Cross-platform region screenshot tool: hotkey, freeze screen, drag a region."
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/CubityFirst/snapr"

[dependencies]
arboard = "3.6.1"
chrono = "0.4.45"
cpal = "0.18.2"
dirs = "7.0.0"
egui = "0.36"
egui-wgpu = { version = "0.36", features = ["winit"] }
egui-winit = "0.36"
epaint_default_fonts = "0.36"
fastrand = "2.5.0"
hmac = "0.13.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
keyring = "4.2.0"
livesplit-hotkey = "0.8.1"
pollster = "1.0.1"
qrcode = { version = "0.14", default-features = false }
rfd = "0.17.2"
rqrr = { version = "0.11", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
tiny-skia = "0.12.0"
toml = "1.1.6"
trash = "5.2.9"
ttf-parser = "0.25"
ureq = "3.4.2"
whoami = "2.1.3"
winit = "0.30"
xcap = "0.9.8"

[profile.release]
lto = "thin"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media", "Win32_Media_Audio", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
